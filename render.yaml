services:
  - type: web
    name: emporio-da-musica-agent
    env: docker
    plan: free
    region: oregon
    branch: main
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.1-flash-lite
      - key: GEMINI_EMBEDDING_MODEL
        value: gemini-embedding-001
      - key: ENVIRONMENT
        value: production
