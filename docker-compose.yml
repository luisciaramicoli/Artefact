services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: emporio-agent-app
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.1-flash-lite}
      - GEMINI_EMBEDDING_MODEL=${GEMINI_EMBEDDING_MODEL:-gemini-embedding-001}
      - DATABASE_URL=sqlite:////app/emporio_musica.db
      - QDRANT_STORAGE_PATH=/app/qdrant_storage
      - QDRANT_COLLECTION_NAME=emporio_policies
      - PORT=8000
      - HOST=0.0.0.0
    volumes:
      - app_data:/app/qdrant_storage
    restart: unless-stopped

volumes:
  app_data:
